name: Validate skill catalog

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate manifests, frontmatter, and package hashes
        run: python tools/validate_catalog.py --check

      - name: Test catalog validator
        run: python -m unittest discover -s tools -p "test_*.py"

